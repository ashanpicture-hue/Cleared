<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Users — Cleared admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;500&display=swap">
<link rel="stylesheet" href="../css/cleared.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="../js/api.js" defer></script>
</head>
<body>
<div class="app-shell">
<aside class="app-sidebar">
<div class="brand" style="color:#ff8a6b"><span class="ic" style="width:28px;height:28px;border-radius:7px;background:#12232f;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff8a6b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Admin</div>
<nav>
<a href="users.html" class="active">Users</a>
<a href="orders.html">Orders</a>
<a href="costs.html">Costs</a>
<a href="refunds.html">Refunds</a>
</nav>
</aside>
<main class="app-main">
<div class="app-header reveal-card">
<h2>Users</h2>
<p style="color:var(--mute);font-size:0.95rem">Customer, reviewer and admin accounts.</p>
</div>

<div class="card reveal-card" style="margin-bottom:20px">
<table class="queue-table">
<thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Shipments</th><th>Joined</th><th>Status</th></tr></thead>
<tbody id="usersBody"></tbody>
</table>
</div>

<div class="card reveal-card">
<h3>Free-order abuse watch</h3>
<p class="sub">One account has used 40 free shipments. Free orders are limited to three per account; this account is flagged for review.</p>
</div>

</main>
</div>

<script src="../js/api.js"></script>
<script>
(function(){
const bodyEl = document.getElementById('usersBody');

async function load() {
  try {
    const data = await ClearedAPI.shipmentAPI.adminUsers();
    const users = data.users || [];
    bodyEl.innerHTML = '';
    users.forEach(u => {
      const row = document.createElement('tr');
      const isFlagged = u.freeOrdersUsed > 3;
      row.innerHTML = `
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.role}</td>
        <td>${u.freeOrdersUsed}</td>
        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
        <td class="${isFlagged ? 'x' : 'ok'}">${isFlagged ? 'Flagged' : 'Active'}</td>
      `;
      bodyEl.appendChild(row);
    });
    gsap.from('tr', { opacity: 0, y: 10, stagger: 0.08, duration: 0.4 });
  } catch (err) {
    bodyEl.innerHTML = '<tr><td colspan="6">Unable to load users.</td></tr>';
  }
}
load();
})();
</script>
</body>
</html>
