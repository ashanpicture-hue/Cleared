<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — Cleared</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;500&display=swap">
<link rel="stylesheet" href="../css/cleared.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="../js/api.js" defer></script>
</head>
<body>

<header class="top"><div class="bar">
<a class="logo" href="../index.html"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Cleared</a>
<nav class="links" aria-label="Main"><a href="../index.html#how">How it works</a><a href="../pricing.html">Pricing</a><a href="../contact.html">Contact</a></nav>
<a class="go" href="signup.html">Create account</a>
</div></header>
<div class="w" style="max-width:520px">

<section style="padding:48px 0 80px" class="reveal-text">
<h2>Log in</h2>
<p class="sub" style="max-width:none">Enter your phone number. We'll send a 6-digit code by SMS or WhatsApp.</p>

<div class="card reveal-card">
<form id="loginForm" novalidate>
<div class="form-group">
<label for="phone">Phone number</label>
<input type="tel" id="phone" name="phone" placeholder="+92 300 1234567" maxlength="15" required>
</div>
<button class="btn" type="submit">Send code</button>
<p id="loginMsg" style="margin-top:12px;font-size:0.9rem;color:var(--mute)"></p>
</form>
</div>

<div id="otpBox" style="display:none;margin-top:20px" class="card reveal-card">
<form id="otpForm" novalidate>
<div class="form-group">
<label for="phone2">Phone number</label>
<input type="tel" id="phone2" name="phone2" disabled>
</div>
<div class="form-group">
<label>Verification code</label>
<div class="otp-row">
<input type="text" class="otp-input" maxlength="1" autocomplete="one-time-code" inputmode="numeric">
<input type="text" class="otp-input" maxlength="1" autocomplete="one-time-code" inputmode="numeric">
<input type="text" class="otp-input" maxlength="1" autocomplete="one-time-code" inputmode="numeric">
<input type="text" class="otp-input" maxlength="1" autocomplete="one-time-code" inputmode="numeric">
<input type="text" class="otp-input" maxlength="1" autocomplete="one-time-code" inputmode="numeric">
<input type="text" class="otp-input" maxlength="1" autocomplete="one-time-code" inputmode="numeric">
</div>
<p id="otpMsg" style="color:var(--mute);font-size:0.85rem;margin-top:8px"></p>
</div>
<button class="btn" type="submit">Verify code</button>
<p style="margin-top:12px;font-size:0.9rem">Didn't get a code? <a href="#" id="resendLink" style="color:var(--sea);font-weight:600">Resend</a></p>
</form>
</div>

<p style="margin-top:20px;text-align:center">Don't have an account? <a href="signup.html" style="color:var(--sea);font-weight:600">Create account</a></p>

</section>

<footer class="site" style="margin-top:0"><div class="w">
<div class="legal" style="justify-content:center"><span>© 2026 Cleared.</span><nav aria-label="Legal" style="gap:16px"><a href="../terms.html">Terms of Service</a><a href="../privacy.html">Privacy Policy</a><a href="../refund.html">Refund Policy</a></nav></div>
</div></footer>

<script src="../js/api.js"></script>
<script>
(function(){
const form = document.getElementById('loginForm');
const msg = document.getElementById('loginMsg');
const btn = form.querySelector('button[type="submit"]');
const otpBox = document.getElementById('otpBox');
const otpForm = document.getElementById('otpForm');
const otpMsg = document.getElementById('otpMsg');
const phone2 = document.getElementById('phone2');
const resendLink = document.getElementById('resendLink');

let pendingPhone = '';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = form.phone.value.trim();
  if (!phone) { msg.textContent = 'Please enter a phone number.'; return; }

  btn.disabled = true;
  btn.textContent = 'Sending code…';
  msg.textContent = '';

  try {
    await ClearedAPI.authAPI.login(phone);
    pendingPhone = phone;
    phone2.value = phone;
    msg.textContent = '';
    otpBox.style.display = 'block';
    otpForm.scrollIntoView({ behavior: 'smooth' });
    gsap.from(otpBox, { opacity: 0, y: 20, duration: 0.4 });
  } catch (err) {
    msg.textContent = err.message || 'Something went wrong. Try again.';
    btn.disabled = false;
    btn.textContent = 'Send code';
    gsap.fromTo(btn, { scale: 1 }, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
  }
});

resendLink.addEventListener('click', async (e) => {
  e.preventDefault();
  if (!pendingPhone) return;
  resendLink.textContent = 'Resending…';
  try {
    await ClearedAPI.authAPI.resendOTP(pendingPhone);
    resendLink.textContent = 'Resend';
    otpMsg.textContent = 'A new code has been sent.';
    otpMsg.style.color = 'var(--ok)';
  } catch (err) {
    resendLink.textContent = 'Resend';
    otpMsg.textContent = err.message || 'Failed to resend.';
    otpMsg.style.color = 'var(--flag)';
  }
});

otpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  let code = '';
  otpForm.querySelectorAll('.otp-input').forEach(i => code += i.value);
  if (code.length !== 6) { otpMsg.textContent = 'Please enter all 6 digits.'; return; }

  otpMsg.textContent = 'Verifying…';
  try {
    const data = await ClearedAPI.authAPI.verifyOTP(pendingPhone, code);
    if (data.token && data.user) {
      otpMsg.textContent = 'Logged in. Redirecting…';
      setTimeout(() => { location.href = 'shipment.html'; }, 700);
    }
  } catch (err) {
    otpMsg.textContent = err.message || 'Invalid code. Try again.';
    gsap.fromTo(otpForm, { x: -8 }, { x: 8, duration: 0.1, yoyo: true, repeat: 3 });
  }
});

var inputs = otpForm.querySelectorAll('.otp-input');
inputs.forEach((input, index) => {
  input.addEventListener('input', () => {
    if (input.value && index < inputs.length - 1) inputs[index + 1].focus();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !input.value && index > 0) inputs[index - 1].focus();
  });
});
})();
</script>
</body>
</html>
